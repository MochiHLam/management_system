services:
  backend:
    build:
      context: ./backend
    container_name: management-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
  
  frontend:
    build:
      context: ./frontend
    container_name: management-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    